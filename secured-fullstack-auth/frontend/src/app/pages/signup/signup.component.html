<div class="auth-container">
  <div class="auth-card">
    <h2>Create an Account</h2>
    @if (errorMessage) { <div class="error-banner">{{ errorMessage }}</div> }
    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Enter username">
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" formControlName="email" placeholder="Enter email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Min 6 characters">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" placeholder="Repeat password">
        @if (signupForm.errors?.['passwordMismatch'] && signupForm.get('confirmPassword')?.touched) {
          <small class="error-text">Passwords do not match.</small>
        }
      </div>
      <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
    </form>
    <p class="toggle-text">Already have an account? <a routerLink="/login">Login here</a></p>
  </div>
</div>
