<div class="auth-container">
  <div class="auth-card">
    <h2>Welcome Back</h2>
    @if (errorMessage) { <div class="error-banner">{{ errorMessage }}</div> }
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" formControlName="username" placeholder="Enter your username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password">
      </div>
      <button type="submit" [disabled]="loginForm.invalid">Log In</button>
    </form>
    <p class="toggle-text">Don't have an account? <a routerLink="/signup">Sign up here</a></p>
  </div>
</div>
