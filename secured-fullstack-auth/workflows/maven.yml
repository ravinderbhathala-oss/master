name: Java CI - Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # Run commands from the project directory where pom.xml is located
        working-directory: secured-fullstack-auth

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven (use wrapper if present)
        run: |
          if [ -x ./mvnw ]; then
            ./mvnw -B -U clean package
          else
            mvn -B -U clean package
          fi
